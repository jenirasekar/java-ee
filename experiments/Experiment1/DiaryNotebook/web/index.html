<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diary App</title>
    <link href="static/bootstrap/css/bootstrap.rtl.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h3 class="mb-3 text-center">📔 Diary App</h3>

    <!-- Top Controls -->
    <div class="d-flex justify-content-between mb-3">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#entryModal" onclick="openAddModal()">
            + Add New Diary
        </button>

        <input type="text" id="searchInput" class="form-control w-50" placeholder="Search..." onkeyup="renderTable()">
    </div>

    <!-- Table -->
    <div class="card p-3">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Title</th>
                <th>Date</th>
                <th style="width: 220px;">Actions</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <!-- Pagination -->
        <nav>
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>
</div>

<!-- Modal (Add/Edit/View) -->
<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 id="modalTitle" class="modal-title">Diary</h5>
            </div>

            <div class="modal-body">
                <input type="hidden" id="entryId">

                <input type="text" id="title" class="form-control mb-2" placeholder="Title">
                <textarea id="content" class="form-control" rows="5" placeholder="Write here..."></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn btn-success" onclick="saveEntry()">Save</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>

        </div>
    </div>
</div>

<script src="static/bootstrap/js/bootstrap.bundle.js"></script>

<script>
    let entries = JSON.parse(localStorage.getItem("entries")) || [];
    let currentPage = 1;
    let rowsPerPage = 5;

    // SAVE (CREATE / UPDATE)
    function saveEntry() {
        let id = document.getElementById("entryId").value;
        let title = document.getElementById("title").value;
        let content = document.getElementById("content").value;

        if (!title || !content) {
            alert("Please fill all fields!");
            return;
        }

        if (id) {
            // UPDATE
            entries = entries.map(e => e.id == id ? { ...e, title, content } : e);
        } else {
            // CREATE
            entries.unshift({
                id: Date.now(),
                title,
                content,
                date: new Date().toLocaleString()
            });
        }

        localStorage.setItem("entries", JSON.stringify(entries));
        bootstrap.Modal.getInstance(document.getElementById("entryModal")).hide();

        renderTable();
    }

    // OPEN ADD
    function openAddModal() {
        document.getElementById("modalTitle").innerText = "Add Diary";
        document.getElementById("entryId").value = "";
        document.getElementById("title").value = "";
        document.getElementById("content").value = "";
    }

    // VIEW
    function viewEntry(id) {
        let entry = entries.find(e => e.id == id);

        document.getElementById("modalTitle").innerText = "View Diary";
        document.getElementById("entryId").value = entry.id;
        document.getElementById("title").value = entry.title;
        document.getElementById("content").value = entry.content;

        document.getElementById("title").disabled = true;
        document.getElementById("content").disabled = true;

        // Open modal
        new bootstrap.Modal(document.getElementById("entryModal")).show();
    }

    // EDIT
    function editEntry(id) {
        let entry = entries.find(e => e.id == id);

        document.getElementById("modalTitle").innerText = "Edit Diary";
        document.getElementById("entryId").value = entry.id;
        document.getElementById("title").value = entry.title;
        document.getElementById("content").value = entry.content;

        document.getElementById("title").disabled = false;
        document.getElementById("content").disabled = false;

        new bootstrap.Modal(document.getElementById("entryModal")).show();
    }

    // DELETE
    function deleteEntry(id) {
        if (confirm("Are you sure you want to delete this entry?")) {
            entries = entries.filter(e => e.id != id);
            localStorage.setItem("entries", JSON.stringify(entries));
            renderTable();
        }
    }

    // RENDER TABLE WITH SEARCH + PAGINATION
    function renderTable() {
        let table = document.getElementById("tableBody");
        let search = document.getElementById("searchInput").value.toLowerCase();

        let filtered = entries.filter(e =>
            e.title.toLowerCase().includes(search) ||
            e.content.toLowerCase().includes(search)
        );

        let start = (currentPage - 1) * rowsPerPage;
        let paginated = filtered.slice(start, start + rowsPerPage);

        table.innerHTML = "";

        paginated.forEach(entry => {
            table.innerHTML += `
            <tr>
                <td>${entry.title}</td>
                <td>${entry.date}</td>
                <td>
                    <button class="btn btn-success btn-sm" onclick="viewEntry(${entry.id})">View</button>
                    <button class="btn btn-warning btn-sm" onclick="editEntry(${entry.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteEntry(${entry.id})">Delete</button>
                </td>
            </tr>
        `;
        });

        renderPagination(filtered.length);
    }

    // PAGINATION
    function renderPagination(totalItems) {
        let totalPages = Math.ceil(totalItems / rowsPerPage);
        let pagination = document.getElementById("pagination");

        pagination.innerHTML = "";

        for (let i = 1; i <= totalPages; i++) {
            pagination.innerHTML += `
            <li class="page-item ${i === currentPage ? 'active' : ''}">
                <button class="page-link" onclick="changePage(${i})">${i}</button>
            </li>
        `;
        }
    }

    // CHANGE PAGE
    function changePage(page) {
        currentPage = page;
        renderTable();
    }

    // INITIAL LOAD
    renderTable();

    document.getElementById("entryModal").addEventListener("hidden.bs.modal", function () {
        document.getElementById("title").disabled = false;
        document.getElementById("content").disabled = false;
    });
</script>

</body>
</html>
